services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sysml_backend
    ports:
      - "8000:8000"
    volumes:
      # Monte le dépôt SysML-v2-Release en lecture seule dans le container
      - ../SysML-v2-Release:/app/SysML-v2-Release:ro
      # Persiste les données (sessions, ChromaDB) entre les redémarrages
      - backend_data:/app/data
    env_file:
      - .env
    environment:
      - SYSML_REPO_PATH=/app/SysML-v2-Release
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - SYSON_URL=http://syson:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sysml_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  syson-db:
    image: postgres:15
    container_name: sysml_syson_db
    environment:
      POSTGRES_DB: syson
      POSTGRES_USER: syson
      POSTGRES_PASSWORD: syson
    volumes:
      - syson_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  syson:
    image: eclipsesyson/syson:v2026.1.0
    container_name: sysml_syson
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://syson-db/syson
      SPRING_DATASOURCE_USERNAME: syson
      SPRING_DATASOURCE_PASSWORD: syson
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
    depends_on:
      - syson-db
    restart: unless-stopped

volumes:
  backend_data:
  syson_db_data:
